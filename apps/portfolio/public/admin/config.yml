backend:
  name: github
  repo: azrilpramudia/personal-website
  branch: main

media_folder: apps/portfolio/public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Blog
    label_singular: Artikel
    folder: apps/blog/src/content/posts
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    media_folder: /apps/blog/public/uploads
    public_folder: /uploads
    fields:
      - { name: title, label: Judul, widget: string }
      - {
          name: description,
          label: Deskripsi singkat,
          widget: text,
          pattern: ["^.{1,200}$", "Maksimal 200 karakter"],
        }
      - {
          name: pubDate,
          label: Tanggal terbit,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
        }
      - {
          name: updatedDate,
          label: Tanggal update,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
          required: false,
        }
      - name: category
        label: Kategori
        widget: select
        options:
          [
            Networking,
            "Linux & SysAdmin",
            "DevOps & Infrastructure",
            "Backend & Programming",
            "Monitoring & Automation",
          ]
      - {
          name: tags,
          label: "Tag (huruf kecil, pakai tanda hubung)",
          widget: list,
          required: false,
        }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: body, label: Isi artikel, widget: markdown }

  - name: experience
    label: Experience
    label_singular: Entri pengalaman
    folder: apps/portfolio/src/content/experience
    extension: json
    format: json
    create: true
    slug: "{{organization}}-{{role}}"
    summary: "{{role}} · {{organization}}"
    fields:
      - {
          name: published,
          label: Tampilkan di situs,
          widget: boolean,
          default: false,
        }
      - { name: organization, label: Organisasi / Institusi, widget: string }
      - { name: role, label: Peran, widget: string }
      - name: type
        label: Jenis
        widget: select
        options: [Employment, Internship, Education, Training, Organization]
      - {
          name: start,
          label: "Mulai (YYYY-MM)",
          widget: string,
          pattern: ['^\d{4}-\d{2}$', "Format YYYY-MM, mis. 2024-08"],
        }
      - {
          name: end,
          label: "Selesai (YYYY-MM atau Present)",
          widget: string,
          default: Present,
          pattern: ['^(\d{4}-\d{2}|Present)$', "Format YYYY-MM atau Present"],
        }
      - { name: location, label: Lokasi, widget: string, required: false }
      - {
          name: highlights,
          label: "Poin kontribusi (2-4, konkret)",
          widget: list,
          min: 1,
        }
      - { name: tools, label: Tools, widget: list, required: false }

  - name: projects
    label: Projects
    label_singular: Proyek
    folder: apps/portfolio/src/content/projects
    extension: json
    format: json
    create: true
    slug: "{{name}}"
    summary: "{{name}} · {{status}}"
    media_folder: /apps/portfolio/public/uploads/projects
    public_folder: /uploads/projects
    fields:
      - {
          name: published,
          label: Tampilkan di situs,
          widget: boolean,
          default: false,
        }
      - {
          name: order,
          label: "Urutan (kecil = lebih dulu)",
          widget: number,
          value_type: int,
          default: 100,
        }
      - { name: name, label: Nama proyek, widget: string }
      - { name: summary, label: Ringkasan masalah dan hasil, widget: text }
      - { name: role, label: Peran / kontribusi kamu, widget: string }
      - name: category
        label: Kategori
        widget: select
        options:
          [
            Network Engineering,
            System Administration,
            "Infrastructure & DevOps",
            Backend Development,
            Monitoring & Automation,
            Web Applications,
          ]
      - name: status
        label: Status
        widget: select
        options: [Completed, In Progress, Archived]
      - {
          name: tech,
          label: "Teknologi (hanya yang benar-benar dipakai)",
          widget: list,
          min: 1,
        }
      - {
          name: repoUrl,
          label: URL repositori,
          widget: string,
          required: false,
          pattern: ["^https?://", "Harus diawali http:// atau https://"],
        }
      - {
          name: demoUrl,
          label: URL demo,
          widget: string,
          required: false,
          pattern: ["^https?://", "Harus diawali http:// atau https://"],
        }
      - { name: image, label: Screenshot, widget: image, required: false }
      - {
          name: imageAlt,
          label: Teks alternatif gambar,
          widget: string,
          required: false,
        }
