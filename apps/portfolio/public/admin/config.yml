backend:
  name: github
  repo: azrilpramudia/personal-website
  branch: main

media_folder: apps/portfolio/public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Blog
    label_singular: Article
    folder: apps/blog/src/content/posts
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    media_folder: /apps/blog/public/uploads
    public_folder: /uploads
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: description,
          label: Short description,
          widget: text,
          pattern: ["^.{1,200}$", "Maximum 200 characters"],
        }
      - {
          name: pubDate,
          label: Publish date,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
        }
      - {
          name: updatedDate,
          label: Updated date,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
          required: false,
        }
      - name: category
        label: Category
        widget: select
        options:
          [
            Networking,
            "Linux & SysAdmin",
            "DevOps & Infrastructure",
            "Backend & Programming",
            "Monitoring & Automation",
          ]
      - {
          name: tags,
          label: "Tags (lowercase, use hyphens)",
          widget: list,
          required: false,
        }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: body, label: Article body, widget: markdown }

  - name: experience
    label: Experience
    label_singular: Experience entry
    folder: apps/portfolio/src/content/experience
    extension: json
    format: json
    create: true
    slug: "{{organization}}-{{role}}"
    summary: "{{role}} · {{organization}}"
    fields:
      - {
          name: published,
          label: Show on site,
          widget: boolean,
          default: false,
        }
      - { name: organization, label: Organization / Institution, widget: string }
      - { name: role, label: Role, widget: string }
      - name: type
        label: Type
        widget: select
        options: [Employment, Internship, Education, Training, Organization]
      - {
          name: start,
          label: "Start (YYYY-MM)",
          widget: string,
          pattern: ['^\d{4}-\d{2}$', "Format YYYY-MM, e.g. 2024-08"],
        }
      - {
          name: end,
          label: "End (YYYY-MM or Present)",
          widget: string,
          default: Present,
          pattern: ['^(\d{4}-\d{2}|Present)$', "Format must be YYYY-MM or Present"],
        }
      - { name: location, label: Location, widget: string, required: false }
      - {
          name: highlights,
          label: "Highlights (2-4, specific)",
          widget: list,
          min: 1,
        }
      - { name: tools, label: Tools, widget: list, required: false }

  - name: projects
    label: Projects
    label_singular: Project
    folder: apps/portfolio/src/content/projects
    extension: json
    format: json
    create: true
    slug: "{{name}}"
    summary: "{{name}} · {{status}}"
    fields:
      - {
          name: published,
          label: Show on site,
          widget: boolean,
          default: false,
        }
      - {
          name: order,
          label: "Order (lower numbers appear first)",
          widget: number,
          value_type: int,
          default: 100,
        }
      - { name: name, label: Project name, widget: string }
      - { name: summary, label: "Summary: problem and outcome", widget: text }
      - { name: role, label: "Your role / contribution", widget: string }
      - name: category
        label: Category
        widget: select
        options:
          [
            Network Engineering,
            System Administration,
            "Infrastructure & DevOps",
            Backend Development,
            Monitoring & Automation,
            Web Applications,
          ]
      - name: status
        label: Status
        widget: select
        options: [Completed, In Progress, Archived]
      - {
          name: tech,
          label: "Technologies (only those actually used)",
          widget: list,
          min: 1,
        }
      - {
          name: repoUrl,
          label: Repository URL,
          widget: string,
          required: false,
          pattern: ["^https?://", "Must start with http:// or https://"],
        }
      - {
          name: demoUrl,
          label: Demo URL,
          widget: string,
          required: false,
          pattern: ["^https?://", "Must start with http:// or https://"],
        }
